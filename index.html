<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ماركت أدم | متجر إلكتروني</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/customer.css">
</head>
<body data-page="customer">

<header class="app-header">
  <div class="logo-area">
    <div class="logo-icon">🛒</div>
    <div class="logo-text">ماركت <span>أدم</span></div>
  </div>
  <div class="header-controls">
    <div class="rate-badge">💱 1$ = <span id="rateBadgeValue">15000</span> ل.س</div>
    <div class="cart-badge" id="cartBadgeBtn">🧺 <span class="cart-count" id="cartCountHeader">0</span></div>
    <a href="admin.html" class="icon-btn">🔐 دخول المشرف</a>
  </div>
</header>

<div class="search-bar-section">
  <div class="search-input-wrapper">
    <span class="search-icon">🔍</span>
    <input type="text" class="search-input" id="searchInput" placeholder="ابحث عن منتج بالاسم أو الكود...">
    <button class="search-clear" id="searchClearBtn">✕</button>
  </div>
  <div class="search-info" id="searchInfo" style="display:none;"></div>
  <div class="category-filter-bar" id="categoryFilterBar"></div>
</div>

<div class="categories-container" id="categoriesContainer"></div>

<div class="cart-section" id="cartSection">
  <div class="cart-header">
    <h3>🧺 سلة المشتريات <span class="badge" id="cartItemCount">0</span></h3>
    <button class="btn btn-danger btn-sm" id="clearCartBtn">🗑️ مسح الكل</button>
  </div>
  <div class="cart-items" id="cartItemsContainer">
    <div class="empty-cart-msg">السلة فارغة، أضف منتجات 🛒</div>
  </div>
  <div class="cart-summary">
    <div class="summary-row"><span>المجموع الفرعي</span><span id="cartSubtotal">0 ل.س</span></div>
    <div class="summary-row"><span>رسوم الشحن</span><span id="cartShipping">-</span></div>
    <div class="shipping-info-box" id="shippingInfoBox"></div>
    <div class="summary-row total"><span>المجموع الكلي</span><span id="cartTotalAmount">0 ل.س</span></div>
  </div>
  <button class="checkout-btn" id="checkoutBtn"><span>📱</span> إتمام الطلب وإرسال واتساب</button>
</div>

<div class="modal-overlay" id="checkoutOverlay">
  <div class="modal">
    <button class="modal-close" id="checkoutCloseBtn">✕</button>
    <div class="modal-header">
      <h2>🧑 بيانات الزبون</h2>
      <p>يرجى إدخال بياناتك لإتمام الطلب</p>
    </div>
    <div class="co-field"><label>الاسم الكامل <span class="required">*</span></label><input type="text" id="customerName"></div>
    <div class="co-field"><label>رقم الهاتف <span class="required">*</span></label><input type="tel" id="customerPhone"></div>
    <div class="co-field"><label>العنوان الكامل <span class="required">*</span></label><textarea id="customerAddress" rows="3"></textarea></div>
    <div class="co-field"><label>ملاحظات إضافية (اختياري)</label><textarea id="customerNotes" rows="2"></textarea></div>
    <div class="order-summary-box">
      <h4>📋 ملخص الطلب</h4>
      <div class="order-summary-items" id="orderSummaryItems"></div>
      <div class="order-summary-totals" id="orderSummaryTotals"></div>
    </div>
    <div class="co-actions">
      <button class="btn btn-secondary" id="cancelCheckoutBtn">إلغاء</button>
      <button class="btn btn-whatsapp" id="confirmOrderBtn"><span>📱</span> تأكيد وإرسال واتساب</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="successOverlay">
  <div class="success-modal">
    <div class="success-icon">✅</div>
    <h2>تم إنشاء طلبك بنجاح!</h2>
    <div class="order-num" id="successOrderNum">#</div>
    <div class="invoice-preview-container">
      <h4>🧾 فاتورتك جاهزة</h4>
      <img id="invoicePreviewImg" class="invoice-preview-img" alt="الفاتورة">
    </div>
    <div class="success-actions">
      <button class="btn btn-whatsapp" id="resendWhatsappBtn">📱 إعادة إرسال واتساب</button>
      <button class="btn btn-print" id="printInvoiceBtn">🖨️ طباعة</button>
      <button class="btn btn-secondary" id="downloadInvoiceBtn">💾 تحميل</button>
      <button class="btn btn-secondary" id="closeSuccessBtn">إغلاق</button>
    </div>
  </div>
</div>

<div class="toast-msg" id="toastMsg">✓</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/state.js"></script>
<script src="js/utils.js"></script>
<script src="js/notifications.js"></script>
<script src="js/invoice.js"></script>
<script src="js/cart.js"></script>
<script src="js/customer.js"></script>
</body>
</html>
